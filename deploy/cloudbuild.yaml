# Cloud Build pipeline: build the dual-purpose image and push to Artifact Registry.
#
# Run from the el_nino repo root (the build context is this repo):
#   gcloud builds submit --config deploy/cloudbuild.yaml --substitutions=_REGION=us-central1 .
#
# .gcloudignore (repo root) keeps data/, .git, .env, etc. out of the upload, so
# the context is ~12 MB — no manual staging needed. Tags :latest only; a plain
# `gcloud builds submit` doesn't populate $SHORT_SHA, and the deploy scripts
# pull :latest anyway.

substitutions:
  _REGION: us-central1
  _REPO: el-nino
  # One shared image for every country deployment — country is selected at
  # runtime via the COUNTRY env var on each Cloud Run service/job.
  _IMAGE: el-nino-dash

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - .

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
